  <!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Welcome to the ocean</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/token.css">
    <link rel="stylesheet" href="/css/style_login_page.css">
  </head>
  <body>
    <main>
      <div class="logo-wrapper">
        <a href="/" class="logo-badge">
          <img src="/image/logo_projet_web.png" alt="Logo" class="header-logo">
        </a>
      </div>

      {% if errors %}
      <div class="alert-danger">
          <ul>
              {% for error in errors %}
                  <li>{{ error }}</li>
              {% endfor %}
          </ul>
      </div>
      {% endif %}

      <div class="container{% if login %} right-panel-active{% endif %}" id="container">
        <div class="form-container sign-up-container">
          <form id="signup-form" action="/inscription" method="post">
            <h1>S'inscrire</h1>
            <div class="field-group">
              <label for="signup-type">Type de Compte</label>
              <select id="signup-type" name="type_compte" required>
                <option value="" disabled {% if post.type_compte is not defined or post.type_compte == '' %}selected="selected"{% endif %}>Choisir un type</option>
                <option value="etudiant" {% if post.type_compte is defined and post.type_compte == 'etudiant' %}selected="selected"{% endif %}>Étudiant</option>
                <option value="pilote" {% if post.type_compte is defined and post.type_compte == 'pilote' %}selected="selected"{% endif %}>Pilote</option>
                <option value="entreprise" {% if post.type_compte is defined and post.type_compte == 'entreprise' %}selected="selected"{% endif %}>Entreprise</option>
              </select>
            </div>
            <div class="field-group" id="nom-group">
              <label for="signup-nom">Nom</label>
              <input type="text" id="signup-nom" name="nom" required
                     value="{{ post.nom|default('')|e }}"/>
            </div>
            <div class="field-group" id="prenom-group">
              <label for="signup-prenom">Prénom</label>
              <input type="text" id="signup-prenom" name="prenom" required
                     value="{{ post.prenom|default('')|e }}"/>
            </div>
            <div class="field-group">
              <label for="signup-email">Email</label>
              <input type="email" id="signup-email" name="email" required
                     value="{{ post.email|default('')|e }}"/>
            </div>
            <div class="field-group">
              <label for="signup-mdp">Mot de passe</label>
              <input type="password" id="signup-mdp" name="mdp" required
                     value="{{ post.mdp|default('')|e }}"/>
            </div>
            <div class="field-group">
              <label for="signup-confirm">Confirmation mot de passe</label>
              <input type="password" id="signup-confirm" name="mdp_confirm" required
                     value="{{ post.mdp_confirm|default('')|e }}"/>
            </div>
            <button type="submit" class="btn-main">S'inscrire</button>
          </form>
          <a href="/signin" class="switch_mobile">Déjà un compte ? Connectez-vous</a>
        </div>

        <div class="form-container sign-in-container">
          <form action="/login" method="post">
            <h1>Se connecter</h1>
            <div class="field-group">
              <label for="signin-nom">Email</label>
              <input type="email" id="signin-nom" name="email" required
                     value="{{ post.email|default('')|e }}"/>
            </div>
            <div class="field-group">
              <label for="signin-mdp">Mots de passe</label>
              <input type="password" id="signin-mdp" name="mdp" required
                     value="{{ post.mdp|default('')|e }}"/>
            </div>
            <button type="submit" class="btn-main">Se connecter</button>
          </form>
          <a href="/signup" class="switch_mobile">Pas encore de compte ? Inscrivez-vous</a>
        </div>

        <div class="overlay-container">
          <div class="overlay">
            <div class="overlay-panel overlay-left">
              <h2>Déjà un compte ?</h2>
              <button class="btn-switch" id="signIn">Se connecter</button>
            </div>
            <div class="overlay-panel overlay-right">
              <h2>Votre première fois ici ?</h2>
              <button class="btn-switch" id="signUp">Créer un compte</button>
            </div>
          </div>
        </div>

      </div>
    </main>
    <script src="/scripts/loginpage.js"></script>
    <script src="/scripts/loginPageTypeCompte.js"></script>
  </body>
</html>
